name: Collect data

on:
  schedule:
    # Every day at 06:17 India time (00:47 UTC)
    - cron: "47 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "collectors/**"
      - ".github/workflows/collect.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install -r collectors/requirements.txt

      - name: Collect and build summary
        working-directory: collectors
        run: |
          set -o pipefail
          python run_all.py 2>&1 | tee ../run.log

      - name: Save new data
        run: |
          tail -n 60 run.log > data/last_run.log
          git config user.name "kerala-public-money-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data site/data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Data update $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi

      - name: Report a failed run as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "The daily data run failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo '```'
            tail -n 60 run.log 2>/dev/null || echo "No run log"
            echo '```'
          } > report.md
          gh issue create --title "Data run failed $(date -u +%Y-%m-%d)" --body-file report.md
